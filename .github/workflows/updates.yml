name: updates

# Weekly check that every pinned version is still current, plus manual dispatch.
#
# Deliberately separate from build.yml: this job needs no Docker, no build and no
# package permissions, and a red run means "a version moved upstream", not "the
# image is broken". The report lands in the run summary (Actions -> updates ->
# the run -> Summary) and the job fails when something is actionable, so the
# failure itself is the notification.
#
# A false red is cheap to read (it names the component and the two candidates);
# a stale pin is not, because REA refuses engine builds and helper-tool banners
# that it has not verified.
on:
  schedule:
    - cron: "17 6 * * 1" # Mondays, 06:17 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: updates
  cancel-in-progress: false

jobs:
  pins:
    name: are the pins still current?
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Check pins against upstream and against what REA admits
        run: |
          set -euo pipefail
          # Two passes over the same data: one for the machine, one for the
          # human-readable summary. The script is stdlib-only and takes ~5s.
          scripts/check-updates.py --json --no-fail > "$RUNNER_TEMP/updates.json"
          scripts/check-updates.py --markdown --no-fail > "$RUNNER_TEMP/updates.md"
          cat "$RUNNER_TEMP/updates.md" >> "$GITHUB_STEP_SUMMARY"
          actionable="$(python3 -c "import json;print(json.load(open('$RUNNER_TEMP/updates.json'))['summary']['actionable'])")"
          if [ "$actionable" != "0" ]; then
            echo "::warning::$actionable pinned version(s) are behind - see docs/UPDATES.md for the procedure"
            exit 1
          fi
          echo "all pins current"

      - name: Upload the JSON report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: update-check
          path: ${{ runner.temp }}/updates.json
          if-no-files-found: warn

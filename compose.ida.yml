# =============================================================================
#  Optional overlay: make REA use IDA as its native analysis provider.
#
#    docker compose -f docker-compose.yml -f compose.ida.yml up -d
#
#  IDA is NOT redistributable, so this repo never ships it. Two supported
#  arrangements (see docs/BYO-LICENSES.md):
#
#   A. IDA inside this container
#      - put your installer in vendor/ida/ and build with INSTALL_IDA=1, or
#      - bind-mount an existing install:   IDA_INSTALL_DIR=/opt/ida-pro-9.4
#      - bind-mount your licence:          ./config/ida/ida.hexlic
#      - install the MCP server once:      docker compose exec rea-agent \
#            /opt/rea/scripts/setup-ida-mcp.sh official-headless
#      - config/ida-mcp.json is generated by that script.
#
#   B. IDA MCP running elsewhere (sidecar container, VM, another host)
#      - start it with the `ida-sidecar` profile below, or run it yourself
#      - REA only accepts loopback endpoints, so this overlay forwards
#        127.0.0.1:8745 -> ${IDA_MCP_FORWARD_TARGET} inside the container.
# =============================================================================
name: rea-agent

services:
  rea-agent:
    environment:
      REA_ANALYSIS_PROVIDER: ${REA_ANALYSIS_PROVIDER:-ida}
      # Point this at a registration file; /etc/rea/ida-mcp.json comes from
      # ./config/ida-mcp.json (see docs/BYO-LICENSES.md).
      REA_IDA_MCP_CONFIG: ${REA_IDA_MCP_CONFIG:-/etc/rea/ida-mcp.json}
      IDADIR: ${IDADIR:-/opt/ida}
      REA_IDA_MCP_LOCAL_PORT: ${REA_IDA_MCP_LOCAL_PORT:-8745}
      # REA_IDA_MCP_FORWARD (only for a sidecar/remote IDA MCP) is optional and
      # must not be defined empty - REA rejects empty values. Put it in
      # ./config/rea.env, e.g.  REA_IDA_MCP_FORWARD=ida-mcp:8745
    volumes:
      - ${IDA_INSTALL_DIR:-./vendor/ida}:/opt/ida:ro
      - ${IDA_LICENSE_DIR:-./config/ida}:/etc/rea/ida:ro
      - ${IDA_MCP_CONFIG_FILE:-./config/ida-mcp.json}:/etc/rea/ida-mcp.json:ro

  # --- B: the user's own private IDA MCP image -------------------------------
  # Enabled only with:  docker compose ... --profile ida-sidecar up -d
  # IDA_MCP_IMAGE must point at an image you built yourself from your own IDA
  # installer + licence (see ida/README.md for a starting Dockerfile).
  ida-mcp:
    profiles: ["ida-sidecar"]
    image: ${IDA_MCP_IMAGE:-busybox:latest}   # placeholder; set IDA_MCP_IMAGE in .env
    container_name: ${REA_CONTAINER_NAME:-rea-agent}-ida-mcp
    platform: linux/amd64
    init: true
    restart: unless-stopped
    environment:
      IDADIR: ${IDADIR:-/opt/ida}
      IDA_MCP_MAX_WORKERS: ${IDA_MCP_MAX_WORKERS:-1}
    volumes:
      - ${IDA_INSTALL_DIR:-./vendor/ida}:/opt/ida:ro
      - ${IDA_LICENSE_DIR:-./config/ida}:/home/ida/.idapro:ro
      - ida-work:/work
    # Official Hex-Rays MCP server over Streamable HTTP:
    command: ["ida-mcp", "http", "--host", "0.0.0.0", "--port", "8745"]
    expose:
      - "8745"

volumes:
  ida-work:
    name: ${REA_CONTAINER_NAME:-rea-agent}-ida-work
